## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: '>=4.1.0'
  # # Put list of dependencies here
  # # For components maintained by Espressif:
  # component: "~1.0.0"
  # # For 3rd party components:
  # username/component: ">=1.0.0,<2.0.0"
  # username2/component2:
  #   version: "~1.0.0"
  #   # For transient dependencies `public` flag can be set.
  #   # `public` flag doesn't have an effect dependencies of the `main` component.
  #   # All dependencies of `main` are public by default.
  #   public: true
  # Exactly this version, not "compatible with": player.c links to a function
  # the library exports but declares in no header (esp_flac_dec_parse_frame),
  # and its decode loop depends on how this version's FLAC parser behaves,
  # found by investigation (docs/superpowers/plans/stage3-*-investigation.md).
  # Moving to another version means repeating those checks.
  espressif/esp_audio_codec: "==2.6.2"
